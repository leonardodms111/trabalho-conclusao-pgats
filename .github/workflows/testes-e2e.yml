name: Testes E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testes-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o projeto
        uses: actions/checkout@v4

      - name: Configurar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Executar os testes do trabalho final (headless)
        run: npx cypress run --spec cypress/e2e/trabalho-final.cy.js

      - name: Publicar o relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cypress
          path: cypress/reports/html
